# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 설정 파일 - BYARRIVAL_BE

# ─────────────────────────────────────────
# 🌐 언어 설정
# ─────────────────────────────────────────
language: "ko-KR"

# ─────────────────────────────────────────
# 🔍 코드래빗 리뷰 기본 설정
# ─────────────────────────────────────────
reviews:
  # 리뷰 강도 프로필
  # - "chill"      : 버그/보안 등 중요한 이슈만 코멘트
  # - "assertive"  : 스타일, 네이밍 등 사소한 이슈까지 모두 코멘트
  profile: "chill"

  # PR에 변경 요청(Request Changes) 기능 사용 여부
  # true  → 리뷰 미통과 시 머지 차단 (승인 필요)
  # false → 항상 Comment로만 남김 (머지 차단 없음)
  request_changes_workflow: false

  # PR 상단에 전체 요약(High Level Summary) 자동 생성 여부
  # true  → PR 상단에 변경 내용 전체 요약 자동 생성
  # false → 요약 없음
  high_level_summary: false

  # 리뷰 완료 후 축하 시(poem) 생성 여부
  # true  → 리뷰 완료 후 축하 시 자동 생성
  # false → 시 없음
  poem: false

  # 리뷰 상태 코멘트 표시 여부
  # true  → "리뷰 시작", "리뷰 완료" 등 상태를 코멘트로 알려줌
  # false → 상태 코멘트 없음
  review_status: true

  # 워크스루(파일별 변경 설명) 섹션을 기본으로 접어둘지 여부
  # true  → 접힌 상태로 표시 (클릭해야 펼쳐짐)
  # false → 펼친 상태로 표시
  collapse_walkthrough: false

  # 시퀀스 다이어그램 자동 생성 여부 (API 흐름 등이 변경됐을 때)
  # true  → API 흐름 변경 시 시퀀스 다이어그램 자동 생성
  # false → 다이어그램 없음
  sequence_diagrams: true

  # 변경된 파일 목록 요약 표시 여부
  # true  → PR에서 변경된 파일 목록을 요약해서 보여줌
  # false → 파일 목록 요약 없음
  changed_files_summary: true

  # 자동 리뷰 설정
  auto_review:
    # 자동 리뷰 활성화 여부
    # true  → PR 열리거나 커밋 추가되면 자동으로 리뷰
    # false → 자동 리뷰 안 함 (@coderabbitai review 명령어로 수동 실행)
    enabled: true

    # 드래프트 PR도 리뷰할지 여부
    # true  → 드래프트 PR도 자동 리뷰
    # false → 드래프트 PR은 리뷰 안 함
    drafts: false

    # 증분 리뷰 여부 (새 커밋이 추가됐을 때 전체 재리뷰 vs 변경분만 리뷰)
    # true  → 새 커밋의 변경분만 리뷰
    # false → 새 커밋 추가 시 전체 재리뷰
    auto_incremental_review: true

    # 특정 브랜치로 들어오는 PR만 리뷰할지 여부
    base_branches:
      - "dev" # dev 브랜치로 들어오는 PR 리뷰

  # ── 리뷰에서 제외할 파일/폴더 패턴 ──────────────
  # "!" 접두사 = 제외
  path_filters:
    - "!**/build/**" # 빌드 결과물 제외
    - "!**/.gradle/**" # Gradle 캐시 제외
    - "!gradle/**" # Gradle wrapper 제외
    - "!gradlew" # Gradle 실행 스크립트 제외
    - "!gradlew.bat" # Gradle 실행 스크립트(윈도우) 제외
    - "!**/*.log" # 로그 파일 제외

  # ── 경로별 맞춤 리뷰 지침 ────────────────────────
  # 특정 파일/폴더에 대해 어떤 관점으로 리뷰할지 지정
  # 여기에 지정한 팀컨벤션 반영
  path_instructions:
    # 전체 공통 리뷰 지침
    - path: "**"
      instructions: |
        다음 팀 컨벤션을 기준으로 리뷰해주세요:
        - 버그, 보안 취약점, 데이터 정합성 문제를 가장 먼저 검토해주세요
        - 커밋 메시지는 "타입: 작업내용" 형식을 따릅니다 (ex. feat: 프로젝트 초기 세팅)
        - 커밋 타입: feat, fix, refactor, chore, docs, test
        - 커밋 메시지 형식이 지켜지지 않은 경우, 틀렸다고 지적하기보다 다음 커밋부터 올바른 형식으로 작성할 수 있도록 부드럽게 제안해주세요
        - PR 제출 코드에 System.out.println, printStackTrace가 남아있으면 지적해주세요 (로그는 Slf4j 사용)

    - path: "src/main/java/com/byarrival/domain/*/controller/**"
      instructions: |
        Controller를 리뷰할 때 다음을 확인해주세요:
        - 요청 검증(@Valid)과 응답 변환만 담당하고, 비즈니스 로직은 Service에 있는지 확인
        - Entity를 요청/응답으로 직접 사용하지 않고 DTO를 사용하는지 확인
        - REST API URI와 HTTP Method가 의미에 맞게 사용되었는지 확인

    - path: "src/main/java/com/byarrival/domain/*/service/**"
      instructions: |
        Service를 리뷰할 때 다음을 확인해주세요:

        [트랜잭션]
        - 데이터를 변경하는 메서드에 @Transactional이 누락되지 않았는지 확인
        - 조회만 하는 메서드에는 @Transactional(readOnly = true)가 붙어있는지 확인
        - 트랜잭션 안에 외부 API 호출 등 오래 걸리는 작업이 섞여 있지 않은지 확인

        [예외 처리]
        - 의미 없는 RuntimeException 대신 프로젝트 공통 예외를 사용하는지 확인

        [단일 책임]
        - 하나의 서비스가 여러 도메인의 책임을 지고 있지 않은지 확인
        - 다른 도메인의 Repository를 직접 호출하기보다 해당 도메인의 Service를 거치는지 확인

    - path: "src/main/java/com/byarrival/domain/*/repository/**"
      instructions: |
        Repository를 리뷰할 때 다음을 확인해주세요:
        - N+1 문제가 발생할 수 있는 조회가 없는지 확인 (필요시 fetch join, @EntityGraph 제안)
        - 반복문 안에서 쿼리를 호출하지 않는지 확인

    - path: "src/main/java/com/byarrival/domain/*/entity/**"
      instructions: |
        Entity를 리뷰할 때 다음을 확인해주세요:
        - @Setter, public setter 대신 의도가 드러나는 메서드로 상태를 변경하는지 확인
        - 연관관계는 지연 로딩(LAZY)을 사용하는지 확인
        - 기본 생성자는 protected로 제한하는지 확인

    - path: "src/main/java/com/byarrival/domain/*/dto/**"
      instructions: |
        DTO를 리뷰할 때 다음을 확인해주세요:
        - 요청 DTO는 *Request, 응답 DTO는 *Response 네이밍을 따르는지 확인
        - 정적 팩토리 메서드는 인자 1개면 from, 2개 이상이면 of를 사용하는지 확인

    - path: "src/main/java/com/byarrival/common/**"
      instructions: |
        공통 모듈을 리뷰할 때 다음을 확인해주세요:
        - 특정 도메인에 종속된 코드가 common에 들어오지 않았는지 확인
        - 공통 응답/예외 형식이 프로젝트 전체에서 일관되게 쓰일 수 있는 구조인지 확인
        - 보안 설정(인증/인가, CORS 등)에 허점이 없는지 확인

    - path: "src/main/resources/**"
      instructions: |
        설정 파일을 리뷰할 때 다음을 확인해주세요:
        - DB 비밀번호, API 키, 토큰 등 민감한 정보가 하드코딩되어 있지 않은지 확인
        - 민감 정보는 환경변수로 분리되어 있는지 확인

    - path: "src/test/**"
      instructions: |
        테스트 코드를 리뷰할 때 다음을 확인해주세요:
        - 테스트가 의미 있는 검증을 하는지 확인
        - 성공 케이스뿐 아니라 실패/예외 케이스도 있는지 확인

# ─────────────────────────────────────────
# 💬 채팅(코멘트 답변) 설정
# ─────────────────────────────────────────
chat:
  # CodeRabbit 리뷰 코멘트에 답글 달았을 때 자동으로 응답할지 여부
  # true  → 답글을 달면 자동으로 응답
  # false → @coderabbitai 멘션해야만 응답
  auto_reply: false

# ─────────────────────────────────────────
# 🧠 지식베이스 설정
# ─────────────────────────────────────────
knowledge_base:
  # 지식베이스 사용 거부 여부
  # true  → 지식베이스 사용 안 함
  # false → 지식베이스 사용 (PR 패턴, 팀 학습 내용 축적)
  opt_out: false

  # 웹 검색 허용 여부 (리뷰 중 최신 라이브러리 정보 등 참조)
  web_search:
    # true  → 리뷰 중 웹 검색으로 최신 라이브러리 정보 등 참조 가능
    # false → 웹 검색 사용 안 함
    enabled: true

  # 학습 범위 설정
  learnings:
    # "local"  → 현재 레포지토리만 학습
    # "global" → 조직 전체 레포지토리에서 학습
    scope: local

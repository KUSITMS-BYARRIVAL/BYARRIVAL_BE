name: Refactor
description: 코드 리팩토링 (Jira 하위 작업과 브랜치가 자동으로 만들어집니다)
title: "[REFACTOR] "
labels: ["🔨 Refactor"]
body:
  - type: input
    id: parentKey
    attributes:
      label: "🎟️ 상위 작업 (Jira 스토리)"
      description: "작업할 Jira 스토리 번호를 입력하세요"
      placeholder: "DCK-00"
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: "🌳 브랜치 설명"
      description: "영문 소문자, 숫자, - 만 사용 (kebab-case). 브랜치는 refactor/#이슈번호-DCK-하위작업번호-설명 으로 만들어집니다"
      placeholder: "route-service"
    validations:
      required: true

  - type: textarea
    id: work
    attributes:
      label: "♻️ 리팩토링 내용"
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: "📋 참고사항(있다면 작성)"

name: Deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    # 수동 실행(workflow_dispatch)도 dev에서만 서버에 반영한다
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/deploy.sh,deploy/init-cert.sh,deploy/watchdog.sh,deploy/nginx/default.conf,deploy/prometheus/prometheus.yml,deploy/prometheus/rules/byarrival.yml,deploy/alertmanager/alertmanager.yml,deploy/alertmanager/discord.tmpl,deploy/blackbox/blackbox.yml,deploy/grafana/provisioning/datasources/prometheus.yml,deploy/grafana/provisioning/dashboards/byarrival.yml,deploy/grafana/dashboards/byarrival.json,deploy/db/backup.sh,deploy/db/restore.sh,deploy/db/report.sh,deploy/db/report.sql
          target: ~/byarrival
          strip_components: 1

      # 서버는 이 작업 동안만 유효한 GITHUB_TOKEN으로 GHCR에서 이미지를 받는다
      - name: Run blue/green deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,DEPLOY_IMAGE
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            trap 'docker logout ghcr.io' EXIT
            chmod +x ~/byarrival/deploy.sh ~/byarrival/init-cert.sh ~/byarrival/watchdog.sh ~/byarrival/db/*.sh
            ~/byarrival/deploy.sh "$DEPLOY_IMAGE"

      # 알림이 실패해도 배포 결과는 바뀌지 않는다
      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
          RESULT: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::DISCORD_OPS_WEBHOOK_URL이 없어 알리지 않습니다."; exit 0; fi
          case "$RESULT" in
            success) text="✅ **배포 완료** \`${GITHUB_SHA:0:7}\`" ;;
            cancelled) text="⚠️ **배포 취소** \`${GITHUB_SHA:0:7}\`" ;;
            *) text="🚨 **배포 실패** \`${GITHUB_SHA:0:7}\`" ;;
          esac
          jq -n --arg content "$text <$RUN_URL>" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -fsS --max-time 10 -H 'Content-Type: application/json' -d @- "$WEBHOOK"

name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 Testcontainers로 PostgreSQL·Redis를 띄운다 (러너에 Docker 기본 포함)
      - name: Build and test
        run: ./gradlew build --no-daemon

      # 포크에서 온 PR은 Secret이 비어 있어 건너뛴다. PR 제목은 외부 입력이라 번호와 주소만 보낸다
      - name: Notify Discord on failure
        if: failure()
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then exit 0; fi
          jq -n --arg content "❌ **CI 실패** PR #${PR_NUMBER} <$RUN_URL>" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -fsS --max-time 10 -H 'Content-Type: application/json' -d @- "$WEBHOOK"

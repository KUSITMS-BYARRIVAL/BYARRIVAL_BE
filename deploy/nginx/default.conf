# upstream.inc 는 deploy.sh 가 배포할 때마다 app-blue 또는 app-green 으로 다시 쓴다.
include /etc/nginx/conf.d/upstream.inc;

# 외부 헬스 체크(/healthz)는 DB·Redis를 확인하므로 IP마다 호출 수를 제한한다
limit_req_zone $binary_remote_addr zone=healthz:1m rate=1r/s;

# HTTP: 인증서 발급·갱신 확인 경로만 열고 나머지는 HTTPS로 보낸다
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: 인증서는 certbot 이 /etc/letsencrypt/live/byarrival 에 둔다 (README 참고)
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/byarrival/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byarrival/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 그 밖의 actuator는 서버 내부(127.0.0.1:8081/8082)에서만 확인한다
    location /actuator {
        return 404;
    }

    # 다운 감시용. 전체 상태만 돌려준다(앱·DB·Redis가 모두 정상이면 200, 아니면 503)
    location = /healthz {
        limit_req zone=healthz burst=10 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://app/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        # 프로필 이미지 업로드(최대 10MB)를 받는다. 앱 multipart 설정과 맞춘다
        client_max_body_size 11m;
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

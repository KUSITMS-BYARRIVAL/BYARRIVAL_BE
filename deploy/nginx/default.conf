# upstream.inc 는 deploy.sh 가 배포할 때마다 app-blue 또는 app-green 으로 다시 쓴다.
include /etc/nginx/conf.d/upstream.inc;

# HTTP: 인증서 발급·갱신 확인 경로만 열고 나머지는 HTTPS로 보낸다
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: 인증서는 certbot 이 /etc/letsencrypt/live/byarrival 에 둔다 (README 참고)
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/byarrival/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byarrival/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 헬스 체크는 서버 내부(127.0.0.1:8081/8082)에서만 확인한다
    location /actuator {
        return 404;
    }

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

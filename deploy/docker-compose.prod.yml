# 운영 서버용 compose. 서버의 ~/byarrival 에서 deploy.sh 가 사용한다.
# app-blue, app-green 중 하나만 Nginx에 연결되고, 배포할 때 번갈아 교체된다.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/kusitms-byarrival/byarrival_be:latest}
  env_file: .env
  environment:
    SPRING_PROFILES_ACTIVE: prod
    TZ: Asia/Seoul
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *default-logging

services:
  postgres:
    image: postgres:16
    container_name: byarrival-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4
    container_name: byarrival-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  app-blue:
    <<: *app
    container_name: byarrival-app-blue
    ports:
      - "127.0.0.1:8081:8080"

  app-green:
    <<: *app
    container_name: byarrival-app-green
    ports:
      - "127.0.0.1:8082:8080"

  nginx:
    image: nginx:1.27
    container_name: byarrival-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:

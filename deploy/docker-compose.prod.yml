# 운영 서버용 compose. 서버의 ~/byarrival 에서 deploy.sh 가 사용한다.
# app-blue, app-green 중 하나만 Nginx에 연결되고, 배포할 때 번갈아 교체된다.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: ${APP_IMAGE:-ghcr.io/kusitms-byarrival/byarrival_be:latest}
  env_file: .env
  environment:
    SPRING_PROFILES_ACTIVE: prod
    TZ: Asia/Seoul
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *default-logging

services:
  postgres:
    image: postgres:16
    container_name: byarrival-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    # 느린 쿼리 확인과 실행 계획 설정. 이미 떠 있는 DB에는 README의 "DB·Redis 설정 변경" 절차로 적용한다.
    # 바인드 값에는 개인정보가 있을 수 있어 로그에 남기지 않는다(log_parameter_max_length=0)
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      # SSD 기준 값. 기본값 4.0에서는 인기 기사 집계가 인덱스 대신 route_card 전체를 읽는다
      # (2026-11-24 로컬 load 테스트: 4.0은 2번 모두 전체 p95 20초 이상, 1.1은 4번 중 3번 54~63ms, 1번 990ms로 기준 초과).
      # 운영 디스크는 SSD다(2026-11-24 가비아 콘솔 확인). HDD 서버로 옮기면 4.0으로 되돌린다
      - -c
      - random_page_cost=1.1
    # 외부에는 열지 않고 서버 localhost에만 연다. 개발자는 SSH 터널로 접속한다
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4
    container_name: byarrival-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # hostname은 앱의 HOSTNAME이 되어 디스코드 알림에 어느 쪽 서버인지 표시된다
  app-blue:
    <<: *app
    container_name: byarrival-app-blue
    hostname: byarrival-app-blue
    ports:
      - "127.0.0.1:8081:8080"

  app-green:
    <<: *app
    container_name: byarrival-app-green
    hostname: byarrival-app-green
    ports:
      - "127.0.0.1:8082:8080"

  nginx:
    image: nginx:1.27
    container_name: byarrival-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    # 갱신된 인증서를 읽도록 6시간마다 reload 한다
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $$!; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    restart: unless-stopped
    logging: *default-logging

  # IP 주소 인증서(Let's Encrypt 6일 단기 인증서)를 12시간마다 확인해 갱신한다
  certbot:
    image: certbot/certbot:v5.8.0
    container_name: byarrival-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $$!; done"]
    restart: unless-stopped
    logging: *default-logging

  # 앱 메트릭(/actuator/prometheus)을 compose 네트워크 안에서 수집한다. 외부 포트는 열지 않는다
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: byarrival-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  # 서버 localhost에만 연다. 개발자는 SSH 터널로 접속한다(README 참고)
  # 비밀번호 없이 뜨면 기본 계정(admin/admin)이 생기므로, 비밀번호가 없으면 시작하지 않는다.
  # profile을 둬서 이름을 지정해 띄울 때만(deploy.sh) 시작한다.
  grafana:
    image: grafana/grafana:12.1.0
    container_name: byarrival-grafana
    profiles: ["monitoring"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "GRAFANA_ADMIN_PASSWORD가 없어 Grafana를 시작하지 않습니다." >&2
          exit 1
        fi
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    mem_limit: 256m
    restart: on-failure:3
    logging: *default-logging

  # Prometheus 알림을 디스코드 배치·운영 채널로 보낸다.
  # 웹훅이 없으면 설정을 읽지 못하므로 시작하지 않는다(deploy.sh가 웹훅이 있을 때만 띄운다).
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: byarrival-alertmanager
    profiles: ["monitoring"]
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$ALERT_WEBHOOK_URL" ]; then
          echo "DISCORD_BATCH_WEBHOOK_URL이 없어 Alertmanager를 시작하지 않습니다." >&2
          exit 1
        fi
        umask 077
        printf '%s' "$$ALERT_WEBHOOK_URL" > /tmp/discord-webhook-url
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager --cluster.listen-address=
    environment:
      ALERT_WEBHOOK_URL: ${DISCORD_BATCH_WEBHOOK_URL:-}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/discord.tmpl:/etc/alertmanager/discord.tmpl:ro
      - alertmanager-data:/alertmanager
    mem_limit: 96m
    restart: on-failure:3
    logging: *default-logging

  # Nginx를 거친 서비스 응답, 인증서 만료일, Redis 응답을 확인한다
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: byarrival-blackbox-exporter
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging

  # 서버 CPU·메모리·디스크와 백업 성공 시각(textfile)을 수집한다
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: byarrival-node-exporter
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|snap/.+)($$|/)
    pid: host
    volumes:
      - /:/host:ro,rslave
      - ./metrics:/textfile:ro
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: byarrival-postgres-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    command: ["--collector.long_running_transactions"]
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  alertmanager-data:
  prometheus-data:
  grafana-data:

spring:
  application:
    name: byarrival
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

auth:
  social:
    connect-timeout: 3s
    read-timeout: 5s
    kakao:
      token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
      app-id: ${KAKAO_APP_ID:}
    apple:
      issuer: https://appleid.apple.com
      keys-uri: https://appleid.apple.com/auth/keys
      client-id: ${APPLE_CLIENT_ID:}

rss:
  fetch:
    connect-timeout: 5s
    read-timeout: 10s
    max-response-size: 5MB
    max-redirects: 3
    max-consecutive-failures: 3
  reading:
    chars-per-minute: 500
  selection:
    max-articles-per-category: 20
    similar-title-threshold: 0.37
  crawl:
    connect-timeout: 5s
    read-timeout: 10s
    max-response-size: 5MB
    max-redirects: 3
    concurrency: 8
    min-content-length: 200
    min-hangul-ratio: 0.5
    user-agent: "Mozilla/5.0 (compatible; ByArrival/1.0)"

spring:
  application:
    name: byarrival
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        # 외부 접근은 Nginx에서 막는다. prometheus는 서버 안의 Prometheus만 수집한다
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

monitoring:
  # 웹훅 URL이 비어 있으면 그 채널 알림은 보내지 않는다(로컬·테스트)
  discord:
    error-webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}
    batch-webhook-url: ${DISCORD_BATCH_WEBHOOK_URL:}
    error-dedup-window: 5m
    connect-timeout: 3s
    read-timeout: 5s
  # 알림에 어느 서버(blue/green)에서 났는지 표시한다
  instance-name: ${HOSTNAME:local}

auth:
  social:
    connect-timeout: 3s
    read-timeout: 5s
    kakao:
      token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
      app-id: ${KAKAO_APP_ID:}
    apple:
      issuer: https://appleid.apple.com
      keys-uri: https://appleid.apple.com/auth/keys
      client-id: ${APPLE_CLIENT_ID:}

rss:
  fetch:
    connect-timeout: 5s
    read-timeout: 10s
    max-response-size: 5MB
    max-redirects: 3
    max-consecutive-failures: 3
  reading:
    chars-per-minute: 500
  selection:
    max-articles-per-category: 20
    similar-title-threshold: 0.37
  crawl:
    connect-timeout: 5s
    read-timeout: 10s
    request-timeout: 30s
    max-response-size: 5MB
    max-redirects: 3
    concurrency: 8
    min-content-length: 200
    min-hangul-ratio: 0.5
    user-agent: "Mozilla/5.0 (compatible; ByArrival/1.0)"

route:
  # 선택 기사 예상 읽기시간 합계 허용 범위: T×min-time-ratio 이상, T×max-time-ratio 이하 (RIDE-04)
  min-time-ratio: 0.7
  max-time-ratio: 1.2
  # 후보 카드 풀 크기 = 추천 구성 기사 수 × pool-multiplier
  pool-multiplier: 2
  # 컨디션별 HARD:EASY 비율 (기사 수 기준)
  difficulty-ratios:
    SUNNY: { hard: 3, easy: 2 }
    NORMAL: { hard: 2, easy: 3 }
    CLOUDY: { hard: 1, easy: 4 }
    RAINY: { hard: 1, easy: 4 }

ai:
  anthropic:
    # 비어 있으면 AI 호출이 인증 실패로 끝난다(로컬·테스트)
    api-key: ${ANTHROPIC_API_KEY:}
    timeout: 60s
    max-retries: 2
    # 알림의 예상 비용 계산용. 요약·난이도 모두 Haiku 5.5, 프롬프트 10만 토큰 이하 기준(2026-11 공식 가격)
    input-price-per-million-tokens: 0.10
    output-price-per-million-tokens: 0.50
  summary:
    model: claude-haiku-5-5
    max-tokens: 4000
    # low는 30자 제한을 자주 넘겨(2026-11-10 실제 기사 5건 모두 실패) medium을 쓴다
    effort: medium
    concurrency: 8
    max-retries: 3
  difficulty:
    # 카테고리 하나(최대 20건)를 한 번에 판정한다. 상대 비교라 생각을 깊게 하지 않아도 된다
    model: claude-haiku-5-5
    max-tokens: 4000
    effort: low
    lead-length: 400
    max-retries: 3

jwt:
  secret: ${JWT_SECRET:}
  access-token-validity: 24h
  refresh-token-validity: 30d

notification:
  push:
    # false면 FCM 대신 로그만 남긴다(로컬·테스트). 운영 서버는 FCM_ENABLED=true
    fcm-enabled: ${FCM_ENABLED:false}
    # Firebase 서비스 계정 키 JSON 파일을 base64로 인코딩한 한 줄
    fcm-credentials-base64: ${FCM_CREDENTIALS_BASE64:}
    android-channel-id: default

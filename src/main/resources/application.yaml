spring:
  application:
    name: byarrival
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        # 외부 접근은 Nginx에서 막는다. prometheus는 서버 안의 Prometheus만 수집한다
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

monitoring:
  # 웹훅 URL이 비어 있으면 그 채널 알림은 보내지 않는다(로컬·테스트)
  discord:
    error-webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}
    batch-webhook-url: ${DISCORD_BATCH_WEBHOOK_URL:}
    error-dedup-window: 5m
    connect-timeout: 3s
    read-timeout: 5s
  # 알림에 어느 서버(blue/green)에서 났는지 표시한다
  instance-name: ${HOSTNAME:local}

auth:
  social:
    connect-timeout: 3s
    read-timeout: 5s
    kakao:
      token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
      app-id: ${KAKAO_APP_ID:}
    apple:
      issuer: https://appleid.apple.com
      keys-uri: https://appleid.apple.com/auth/keys
      client-id: ${APPLE_CLIENT_ID:}

rss:
  fetch:
    connect-timeout: 5s
    read-timeout: 10s
    max-response-size: 5MB
    max-redirects: 3
    max-consecutive-failures: 3
  reading:
    chars-per-minute: 500
  selection:
    max-articles-per-category: 20
    similar-title-threshold: 0.37
  crawl:
    connect-timeout: 5s
    read-timeout: 10s
    request-timeout: 30s
    max-response-size: 5MB
    max-redirects: 3
    concurrency: 8
    min-content-length: 200
    min-hangul-ratio: 0.5
    user-agent: "Mozilla/5.0 (compatible; ByArrival/1.0)"

jwt:
  secret: ${JWT_SECRET:}
  access-token-validity: 24h
  refresh-token-validity: 30d

notification:
  push:
    # false면 FCM 대신 로그만 남긴다(로컬·테스트). 운영 서버는 FCM_ENABLED=true
    fcm-enabled: ${FCM_ENABLED:false}
    # Firebase 서비스 계정 키 JSON 파일을 base64로 인코딩한 한 줄
    fcm-credentials-base64: ${FCM_CREDENTIALS_BASE64:}
    android-channel-id: default

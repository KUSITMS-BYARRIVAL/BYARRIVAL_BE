spring:
  application:
    name: byarrival
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      # 프로필 이미지 최대 10MB (MY-02). 요청 전체는 여유를 조금 둔다. Nginx client_max_body_size도 같이 맞춘다
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    redis:
      # 접속자 기록은 로그인한 모든 API 요청에서 Redis를 기다린다. Redis가 응답하지 않을 때 요청이 기본값(60초)만큼
      # 묶이지 않도록 짧게 끊는다. Redis를 쓰는 곳(접속자, 노선 이어보기 위치)은 실패하면 Redis 없이 응답한다
      timeout: 500ms
      connect-timeout: 1s

management:
  endpoints:
    web:
      exposure:
        # 외부 접근은 Nginx에서 막는다. prometheus는 서버 안의 Prometheus만 수집한다
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # p95 계산용 응답 시간 구간. percentiles-histogram을 켜면 URI마다 구간이 약 70개씩 생겨 256MB Prometheus에 부담이라
      # 필요한 구간만 둔다. 알림 기준(500ms, 1초)은 구간 경계에 있어야 정확하다
      slo:
        "[http.server.requests]": 25ms,50ms,100ms,200ms,300ms,400ms,500ms,750ms,1s,2s,5s,10s

server:
  tomcat:
    mbeanregistry:
      # Tomcat 스레드 사용량 메트릭(tomcat_threads_*)
      enabled: true

storage:
  s3:
    # 프로필 이미지 버킷. 비공개이고 CloudFront(public-base-url)로만 읽는다
    bucket: byarrival-media
    region: ap-northeast-2
    # 같은 버킷을 환경별 폴더로 나눠 쓴다(local/, prod/)
    key-prefix: local
    public-base-url: https://d12zg2i2wojklm.cloudfront.net
    # 비어 있으면 업로드가 503으로 끝난다(테스트). 로컬은 application-local.yaml, 운영은 .env에 넣는다
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}

monitoring:
  # 웹훅 URL이 비어 있으면 그 채널 알림은 보내지 않는다(로컬·테스트)
  discord:
    error-webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}
    batch-webhook-url: ${DISCORD_BATCH_WEBHOOK_URL:}
    error-dedup-window: 5m
    connect-timeout: 3s
    read-timeout: 5s
  # 알림에 어느 서버(blue/green)에서 났는지 표시한다
  instance-name: ${HOSTNAME:local}

auth:
  social:
    connect-timeout: 3s
    read-timeout: 5s
    kakao:
      token-info-uri: https://kapi.kakao.com/v1/user/access_token_info
      app-id: ${KAKAO_APP_ID:}
      unlink-uri: https://kapi.kakao.com/v1/user/unlink
      # 회원 탈퇴 시 카카오 연결 끊기에 쓴다. 비어 있으면 연결 끊기를 건너뛴다(로컬·테스트)
      admin-key: ${KAKAO_ADMIN_KEY:}
    apple:
      issuer: https://appleid.apple.com
      keys-uri: https://appleid.apple.com/auth/keys
      client-id: ${APPLE_CLIENT_ID:}
      # 회원 탈퇴 시 Apple 연결 끊기(revoke)에 쓴다. 하나라도 비어 있으면 토큰 저장과 revoke를 건너뛴다(로컬·테스트)
      token-uri: https://appleid.apple.com/auth/token
      revoke-uri: https://appleid.apple.com/auth/revoke
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      # 로그인용(Sign in with Apple) .p8 키 파일을 base64로 인코딩한 한 줄
      private-key-base64: ${APPLE_PRIVATE_KEY_BASE64:}

rss:
  fetch:
    connect-timeout: 5s
    read-timeout: 10s
    max-response-size: 5MB
    max-redirects: 3
    max-consecutive-failures: 3
  reading:
    chars-per-minute: 500
  selection:
    max-articles-per-category: 20
    similar-title-threshold: 0.37
  crawl:
    connect-timeout: 5s
    read-timeout: 10s
    request-timeout: 30s
    max-response-size: 5MB
    max-redirects: 3
    concurrency: 8
    min-content-length: 200
    min-hangul-ratio: 0.5
    user-agent: "Mozilla/5.0 (compatible; ByArrival/1.0)"

route:
  # 선택 기사 예상 읽기시간 합계 허용 범위: T×min-time-ratio 이상, T×max-time-ratio 이하 (RIDE-04)
  min-time-ratio: 0.7
  max-time-ratio: 1.2
  # 후보 카드 풀 크기 = 추천 구성 기사 수 × pool-multiplier
  pool-multiplier: 2
  # 컨디션별 HARD:EASY 비율 (기사 수 기준)
  difficulty-ratios:
    SUNNY: { hard: 3, easy: 2 }
    NORMAL: { hard: 2, easy: 3 }
    CLOUDY: { hard: 1, easy: 4 }
    RAINY: { hard: 1, easy: 4 }
  popular:
    # 많이 담은 뉴스 순위를 보여 주는 최소 인원. 그날 기사를 담은 사용자가 이보다 적으면 집계중 상태 (HOME-07)
    min-users: 30

home:
  # 스몰토크 추천 미리보기 카드 수 (HOME-03)
  smalltalk-preview-size: 3
  # 출근길 공감대 칩별 순위 수 (HOME-05)와 전체보기 순위 수 (HOME-06)
  popular-preview-size: 3
  popular-detail-size: 10

ai:
  anthropic:
    # 비어 있으면 AI 호출이 인증 실패로 끝난다(로컬·테스트)
    api-key: ${ANTHROPIC_API_KEY:}
    timeout: 60s
    max-retries: 2
    # 알림의 예상 비용 계산용. 요약·난이도 모두 Haiku 5.5, 프롬프트 10만 토큰 이하 기준(2026-11 공식 가격)
    input-price-per-million-tokens: 0.10
    output-price-per-million-tokens: 0.50
    # 시스템 프롬프트 캐시(5분) 가격. 쓰기는 입력의 1.25배, 읽기는 0.1배
    cache-write-price-per-million-tokens: 0.125
    cache-read-price-per-million-tokens: 0.01
  summary:
    model: claude-haiku-5-5
    max-tokens: 4000
    # 첫 시도. 2026-11-20 배치에서 출력의 약 80%가 생각 토큰이라 low로 낮춰 측정한다(2026-11-21).
    # low는 30자 제한을 자주 넘기지만(2026-11-10 실제 기사 5건 모두 실패) 형식 위반은 아래 수선 호출로 싸게 고친다
    effort: low
    # 근거·숫자를 어겨 본문과 함께 다시 쓸 때. 2026-11-24 배치에서 medium이 생각 토큰으로 max-tokens(4000)를 약 38번 넘겨
    # 요약 실패 14건 중 10건이 이 때문에 끝나고 호출마다 출력 4000토큰을 버렸다. 첫 시도처럼 low로 낮춰 측정한다
    regenerate-effort: low
    # 글자 수·어미·제목·키워드만 어긴 답은 본문 없이 이전 답과 어긴 규칙만 보내 이 깊이로 고치게 한다.
    # 2026-11-20 배치에서 재요청 1회가 출력 약 2,300토큰(대부분 생각 토큰)을 써 형식 위반만 고치기엔 비쌌다
    repair-effort: low
    concurrency: 8
    max-retries: 3
  difficulty:
    # 카테고리 하나(최대 20건)를 한 번에 판정한다. 상대 비교라 생각을 깊게 하지 않아도 된다
    model: claude-haiku-5-5
    max-tokens: 4000
    effort: low
    lead-length: 400
    max-retries: 3
  quiz:
    # 추천 후보 기사(약 160건)마다 요약으로 3지선다 1문제를 만든다(AI-03)
    model: claude-haiku-5-5
    max-tokens: 4000
    effort: medium
    concurrency: 8
    max-retries: 3
  quiz-check:
    # 만든 퀴즈를 요약만 보고 다시 풀어 정답이 하나로 정해지는지 확인한다(AI-04). 퀴즈 한 번 만들 때마다 1회 호출한다.
    # 2026-11-17 운영 점검에서 135문제 중 3문제의 정답이 틀려(부정형 2, 문제와 엇나간 정답 1) 추가했다
    model: claude-haiku-5-5
    max-tokens: 4000
    effort: medium
  smalltalk:
    # 카테고리별 인기 기사(구글 뉴스 노출 순서) 상위부터 최대 2건씩 한 줄 스몰토크를 만든다(TALK-01)
    model: claude-haiku-5-5
    max-tokens: 4000
    # 한 줄짜리라 깊게 생각하지 않아도 된다. 2026-11-21부터 low로 낮춰 측정한다
    effort: low
    max-retries: 3
    per-category: 2
  story:
    # 요약이 끝난 서비스일 기사 전체(약 160건)를 한 번에 보내 같은 사건끼리 묶는다.
    # 2026-11-11 운영 기사 156건 시험(medium): 사람이 찾은 중복 6묶음 중 3회 평균 5.7묶음, 오판 없음, 입력 약 1.5만·출력 약 2.7천 토큰
    model: claude-haiku-5-5
    max-tokens: 16000
    effort: medium
    max-retries: 2

# 외부 서비스 토큰(Apple refresh token)을 DB에 암호화해 저장하는 AES 키(base64). 비어 있으면 저장하지 않는다
token-encryption:
  key: ${TOKEN_ENCRYPTION_KEY:}

jwt:
  secret: ${JWT_SECRET:}
  access-token-validity: 24h
  refresh-token-validity: 30d

admin:
  auth:
    # 어드민 로그인 유지 시간. 기획 확정 전 가정값
    session-validity: 8h
    # http로 로컬 테스트할 때만 ADMIN_COOKIE_SECURE=false
    cookie-secure: ${ADMIN_COOKIE_SECURE:true}
    # 어드민 웹 주소(쉼표로 구분). 쿠키를 함께 보내므로 정확한 주소만 허용한다
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

notification:
  push:
    # false면 FCM 대신 로그만 남긴다(로컬·테스트). 운영 서버는 FCM_ENABLED=true
    fcm-enabled: ${FCM_ENABLED:false}
    # Firebase 서비스 계정 키 JSON 파일을 base64로 인코딩한 한 줄
    fcm-credentials-base64: ${FCM_CREDENTIALS_BASE64:}
    android-channel-id: default
  # 자동 알림 발송 조건 (DCK-34). 시각은 해당 요일의 출근 시각 기준이다
  auto:
    # false면 시각 기준 자동 알림 작업을 돌리지 않는다(테스트)
    enabled: true
    # 서버 재시작·배포로 1분 단위 작업을 건너뛰어도 이 시간 안이면 보낸다(유형별 하루 1번이라 중복은 없다)
    grace-minutes: 10
    route-ready-before-minutes: 10
    route-incomplete-idle-minutes: 120
    streak-break-after-minutes: 180
    streak-break-min-days: 3
    streak-milestones: [3, 7, 14, 30]
    popular-after-minutes: 30
    # 인기 기사로 보는 최소 인원. 그날 이 기사를 담은 사용자가 이보다 적으면 후보가 아니다
    popular-min-users: 30
    popular-top-size: 10

onboarding:
  # 기획 확정 전 가정값. 기본 이동시간은 DB 제약(5~90분, 5분 단위)과 같아야 한다
  nickname-min-length: 1
  nickname-max-length: 10
  commute-minutes-min: 5
  commute-minutes-max: 90
  commute-minutes-step: 5
